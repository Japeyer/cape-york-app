name: Deploy to GitHub Pages

# Bei jedem Push auf main wird gebuildet und das dist/-Ergebnis nach Pages deployt.
# Manuell auslösbar via "Run workflow" Button im Actions-Tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig — neue Pushes warten, alter Deploy wird gecanceled.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build braucht keine Git-Credentials → Token nicht in .git/config persistieren
          # (Defense-in-depth gegen Token-Diebstahl durch eine kompromittierte npm-Dependency).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches lokale Dev-Umgebung (npm 11)
          cache: 'npm'

      - run: npm ci

      # Tests laufen vor dem Build — bei Fehler stoppt der Workflow und es wird nicht deployed.
      # Schützt davor, dass ein Refactor mit kaputtem Generator live geht.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
